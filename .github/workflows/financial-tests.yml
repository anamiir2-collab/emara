name: Test financial logic

on:
  push:
    branches:
      - main
      - 'bonyan/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  financial-tests:
    name: Financial unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run financial tests
        run: node --experimental-default-type=module --test tests/*.mjs
